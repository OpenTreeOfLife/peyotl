[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peyotl"
version = "0.1.4dev"
description = "Library for interacting with Open Tree of Life resources"
readme = "README.rst"
license = { text = "BSD" }
authors = [
    { name = "Emily Jane B. McTavish and Mark T. Holder" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anyjson",
    "coverage",
    "sh>=1.08",
    "locket>=0.1.1",
    "requests>=2.2.1",
    "redis",
    "argcomplete",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/OpenTreeOfLife/peyotl"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true
zip-safe = false
script-files = [
    "scripts/nexson/validate_ot_nexson.py",
    "scripts/nexson/nexson_newick.py",
    "scripts/nexson/nexson_nexml.py",
    "scripts/phylesystem/ot_phylesystem_list_property_values.py",
    "scripts/phylesystem/ot_phylesystem_list_study_filepaths.py",
    "scripts/phylesystem/ot_phylesystem_list_otu_edited_labels.py",
    "scripts/ot_taxon_report",
    "scripts/clipeyotl.py",
]
